<!DOCTYPE html>
<html>
<head>
  <title>Signup</title>
</head>
<body>
  <h2>Signup Form</h2>

  <form id="signupForm">
    <input type="text" placeholder="Name" id="name" required /><br><br>
    <input type="text" placeholder="City" id="city" required /><br><br>
    <input type="email" placeholder="Email" id="email" required /><br><br>
    <input type="password" placeholder="Password" id="password" required /><br><br>
    <input type="text" placeholder="Location" id="location" required /><br><br>

    <button type="submit">Signup</button>
  </form>

  <script>
    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        name: document.getElementById("name").value,
        city: document.getElementById("city").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
        location: document.getElementById("location").value
      };

      const res = await fetch("/api/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      const result = await res.text();
      alert(result);
    });
  </script>
</body>
</html>
